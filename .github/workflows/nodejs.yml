name: CI

on:
  push:
    branches: [ master, hprc-dev ]
  pull_request:
    # hprc-dev too: Dependabot's update PRs target hprc-dev.
    branches: [ master, hprc-dev ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # jsdom 29 (Jest 30) needs Node ^20.19, ^22.13 or >=24.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npx jest --ci
        env:
          CI: true

  # Python backend tests (tests/) on an older and the newest Python. Python 3.8 (end of life, still
  # supported by requirements.txt) is not tested here; it was checked by hand for 2.1.0.
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.13' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Check dependencies
        run: pip check

      - name: Run tests
        run: python -m pytest -q tests
