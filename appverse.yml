title: "Drona Workflow Engine"
description: "Graphical workflow engine for HPC clusters. Researchers fill in a form, Drona generates all job and workflow files, submits them to the scheduler on the user's behalf, and monitors and manages the resulting workflows. Workflows are defined by site- or user-provided environments."
