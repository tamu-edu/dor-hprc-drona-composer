<div id="dc-logs" style="width: 100%; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif;">
    <style>
        #dc-logs {
            --dc-text: #1e293b;
            --dc-text-muted: #64748b;
            --dc-border: #e2e8f0;
            --dc-divider: #f1f5f9;
            --dc-radius-card: 12px;
            --dc-radius-pill: 999px;
            --dc-live: #10b981;
            color: var(--dc-text);
        }

        #dc-logs .dc-card {
            position: relative;
            width: 100%;
            background: #ffffff;
            /* The surrounding card supplies the frame and the title */
            box-sizing: border-box;
        }

        /* Clips the tab bar/panes to the card's bottom corners without
           clipping the floating title above, which needs to overflow the
           card's own top edge. */
        #dc-logs .dc-body {
            overflow: hidden;
            border-radius: var(--dc-radius-card);
        }



        #dc-logs input[type="radio"] { display: none; }

        #dc-logs .tab-bar {
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid var(--dc-divider);
        }

        #dc-logs .tab-label {
            padding: 10px 18px;
            font-size: 12px;
            font-weight: 600;
            color: var(--dc-text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s ease-in-out, border-color 0.15s ease-in-out;
        }

        #dc-logs .tab-label:hover { color: var(--dc-text); }

        #dc-logs #tab-out:checked ~ .tab-bar label[for="tab-out"] {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        #dc-logs #tab-err:checked ~ .tab-bar label[for="tab-err"] {
            color: #ef4444;
            border-bottom-color: #ef4444;
        }

        #dc-logs .pane {
            min-height: 48px;
            padding: 16px 20px;
            overflow-y: auto;
            display: none;
            font-size: 12.5px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            line-height: 1.6;
            white-space: pre-wrap;
            background: #f8fafc;
            color: #334155;
        }

        #dc-logs .pane-footer {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 6px 20px;
            font-size: 11px;
            color: var(--dc-text-muted);
            border-top: 1px solid var(--dc-divider);
        }
        #dc-logs .pane-footer a { color: #500000; font-weight: 600; text-decoration: none; }
        #dc-logs .pane-footer a:hover { text-decoration: underline; }
        #dc-logs #tab-out:checked ~ #stdout-footer { display: flex; }
        #dc-logs #tab-err:checked ~ #stderr-footer { display: flex; }

        #dc-logs #tab-out:checked ~ #stdout-pane { display: block; }
        #dc-logs #tab-err:checked ~ #stderr-pane { display: block; color: #b91c1c; }
    </style>

    <div class="dc-card">
                <div class="dc-body">
            <input type="radio" id="tab-out" name="dc-logs-toggle" checked>
            <input type="radio" id="tab-err" name="dc-logs-toggle">

            <div class="tab-bar">
                <label for="tab-out" class="tab-label">Standard Output</label>
                <label for="tab-err" class="tab-label">Error Log</label>
            </div>

            <div id="stdout-pane" class="pane" style="max-height: {{PANE_HEIGHT}}px">{{OUTPUT}}</div>
            <div id="stderr-pane" class="pane" style="max-height: {{PANE_HEIGHT}}px">{{ERROR}}</div>

            <div id="stdout-footer" class="pane-footer"><span>Last {{LINES}} lines</span>{{OUT_LINK}}</div>
            <div id="stderr-footer" class="pane-footer"><span>Last {{LINES}} lines</span>{{ERR_LINK}}</div>
        </div>
    </div>
</div>
