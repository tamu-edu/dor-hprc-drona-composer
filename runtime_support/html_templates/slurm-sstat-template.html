<div id="dc-sstat" style="width: 100%; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif;">
    <style>
        #dc-sstat {
            --dc-text: #1e293b;
            --dc-text-muted: #64748b;
            --dc-border: #e2e8f0;
            --dc-divider: #f1f5f9;
            --dc-radius-card: 12px;
            --dc-radius-pill: 999px;
            --dc-live: #10b981;
            color: var(--dc-text);
        }

        #dc-sstat .stat-box { flex: 1; min-width: 140px; padding-left: 12px; }
        #dc-sstat .stat-box.mem { border-left: 3px solid #f59e0b; }
        #dc-sstat .stat-box.cpu { border-left: 3px solid #10b981; }
        #dc-sstat .stat-box.io  { border-left: 3px solid #a855f7; }
        #dc-sstat .stat-box.page { border-left: 3px solid #f43f5e; }

        #dc-sstat .stat-label { color: var(--dc-text-muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        #dc-sstat .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; margin-top: 6px; color: var(--dc-text); }
        #dc-sstat .stat-sub { color: var(--dc-text-muted); font-size: 11px; margin-top: 4px; }
    </style>

        <div class="stat-box mem">
            <div class="stat-label">Memory (Max / Ave)</div>
            <div class="stat-value">{{MAX_RSS}} / {{AVE_RSS}}</div>
            <div class="stat-sub">VM: {{MAX_VM}}</div>
        </div>

        <div class="stat-box cpu">
            <div class="stat-label">CPU Time (Ave / Min)</div>
            <div class="stat-value">{{AVE_CPU}} / {{MIN_CPU}}</div>
            <div class="stat-sub">Tasks: {{N_TASKS}}</div>
        </div>

        <div class="stat-box io">
            <div class="stat-label">Disk I/O (Read / Write)</div>
            <div class="stat-value">{{AVE_READ}} / {{AVE_WRITE}}</div>
        </div>

        <div class="stat-box page">
            <div class="stat-label">Page Data (Max / Ave)</div>
            <div class="stat-value">{{MAX_PAGE}} / {{AVE_PAGE}}</div>
            <div class="stat-sub">CPU Freq: {{CPU_FREQ}}</div>
        </div>
</div>
