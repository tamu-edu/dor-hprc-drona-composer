<div id="dc-workdir" style="width: 100%; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif;">
    <style>
        #dc-workdir {
            --dc-text: #1e293b;
            --dc-text-muted: #64748b;
            --dc-border: #e2e8f0;
            --dc-divider: #f1f5f9;
            --dc-radius-card: 12px;
            --dc-radius-pill: 999px;
            --dc-radius-sm: 8px;
            --dc-live: #10b981;
            --dc-link: #003c71;
            color: var(--dc-text);
        }

        #dc-workdir .dc-path-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--dc-divider);
            border: 1px solid var(--dc-border);
            border-radius: var(--dc-radius-sm);
            padding: 8px 12px;
        }

        #dc-workdir .dc-path-label {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        #dc-workdir .dc-path-label::before {
            content: "";
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dc-live);
            box-shadow: 0 0 6px var(--dc-live);
        }

        #dc-workdir .dc-path-box a {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--dc-link);
            font-weight: 700;
            text-decoration: none;
            word-break: break-all;
        }
        #dc-workdir .dc-path-box a:hover { text-decoration: underline; }
    </style>

        <div class="dc-path-box">
            <span class="dc-path-label">Workflow Directory:</span>
            <a href="/pun/sys/dashboard/files/fs{{JOB_DIR}}" target="_blank" rel="noopener noreferrer">{{JOB_DIR}}</a>
        </div>
</div>
